!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Router
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
ip cef
!
!
no ip dhcp use vrf connected
ip dhcp excluded-address 10.89.67.245 10.89.67.254
ip dhcp excluded-address 10.89.71.233 10.89.71.254
ip dhcp excluded-address 10.89.79.208 10.89.79.254
!
ip dhcp pool AMAZINGOFFICEPOOL
   network 10.89.66.0 255.255.254.0
   default-router 10.89.66.1 
!
ip dhcp pool AMAZINGWIFIPOOL
   network 10.89.68.0 255.255.252.0
   default-router 10.89.68.1 
!
ip dhcp pool AMAZINGFACTORY
   network 10.89.72.0 255.255.248.0
   default-router 10.89.72.2 
!
!
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
ipv6 unicast-routing
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface FastEthernet0/0
 ip address 201.129.18.2 255.255.255.252
 ip nat outside
 ip virtual-reassembly
 duplex auto
 speed auto
 ipv6 address 2002:8880:6922:11EE::2/126
 ipv6 enable
!
interface FastEthernet0/1
 ip address 10.89.65.6 255.255.255.252
 ip nat inside
 ip virtual-reassembly
 duplex auto
 speed auto
 ipv6 address FE80::1 link-local
 ipv6 enable
!
interface FastEthernet1/0
 ip address 10.89.65.2 255.255.255.252
 ip nat inside
 ip virtual-reassembly
 duplex auto
 speed auto
 ipv6 address FE80::1 link-local
 ipv6 enable
!
interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
ip forward-protocol nd
ip route 10.89.66.0 255.255.254.0 10.89.65.1
ip route 10.89.68.0 255.255.252.0 10.89.65.1
ip route 10.89.68.0 255.255.254.0 10.89.65.1
ip route 10.89.72.0 255.255.248.0 10.89.65.5
ip route 201.129.18.4 255.255.255.252 201.129.18.1
ip route 201.129.18.73 255.255.255.255 201.129.18.1
ip route 201.129.18.137 255.255.255.255 201.129.18.1
ip route 201.129.18.169 255.255.255.255 201.129.18.1
ip route 201.129.18.169 255.255.255.255 201.129.18.5
ip route 201.129.18.169 255.255.255.255 201.129.18.6
!
!
ip http server
no ip http secure-server
ip nat pool AMAZINGNATPOOL 201.129.18.217 201.129.18.236 netmask 255.255.255.192
ip nat inside source list 1 pool AMAZINGNATPOOL overload
!
access-list 1 permit 10.89.66.0 0.0.1.255
access-list 1 permit 10.89.68.0 0.0.3.255
ipv6 route 2002:8880:6922:1121::/64 FastEthernet1/0 FE80::2
ipv6 route 2002:8880:6922:1122::/64 FastEthernet1/0 FE80::2
ipv6 route 2002:8880:6922:11DD::/126 2002:8880:6922:11DD::1
ipv6 route 2002:8880:6922:11DD::/126 2002:8880:6922:11EE::1
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
line aux 0
line vty 0 4
 login
!
!
end
