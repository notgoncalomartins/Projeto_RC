!
!

!
version 12.4
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname Router
!
boot-start-marker
boot-end-marker
!
!
no aaa new-model
memory-size iomem 5
ip cef
!
!
no ip dhcp use vrf connected
!
ip dhcp pool GR8POOL
   network 10.0.0.0 255.0.0.0
   default-router 10.192.66.1 
!
ip dhcp pool GR8POOLWIFI
   network 10.192.67.0 255.255.255.0
!
!
ip auth-proxy max-nodata-conns 3
ip admission max-nodata-conns 3
!
ipv6 unicast-routing
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
! 
!
!
!
!
interface FastEthernet0/0
 ip address 201.129.18.6 255.255.255.252
 ip nat outside
 ip virtual-reassembly
 duplex auto
 speed auto
 ipv6 address 2002:8880:6922:11DD::2/126
 ipv6 enable
!
interface FastEthernet0/1
 no ip address
 ip nat inside
 ip virtual-reassembly
 duplex auto
 speed auto
!
interface FastEthernet0/1.1
 encapsulation dot1Q 2
 ip address 10.192.67.1 255.255.255.0
 ip nat inside
 ip virtual-reassembly
 ipv6 address 2002:8880:6922:1112::1/64
 ipv6 enable
!
interface FastEthernet0/1.2
 encapsulation dot1Q 3
 ip address 201.129.18.168 255.255.255.224 secondary
 ip address 10.192.66.1 255.255.255.0
 ip nat inside
 ip virtual-reassembly
 ipv6 address 2002:8880:6922:1111::/64
 ipv6 address 2002:8880:6922:1111::1/64
 ipv6 enable
!
interface FastEthernet1/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
interface FastEthernet2/0
 no ip address
 shutdown
 duplex auto
 speed auto
!
ip forward-protocol nd
ip route 201.129.18.0 255.255.255.252 201.129.18.5
ip route 201.129.18.73 255.255.255.255 201.129.18.5
ip route 201.129.18.137 255.255.255.255 201.129.18.5
!
!
ip http server
no ip http secure-server
ip nat pool GR8NATPOOL 201.129.18.201 201.129.18.215 netmask 255.255.255.224
ip nat inside source list 1 pool GR8NATPOOL overload
!
access-list 1 permit 10.192.66.0
access-list 1 permit 0.0.0.0 255.255.255.0
!
!
!
!
control-plane
!
!
!
!
!
!
!
!
!
!
line con 0
line aux 0
line vty 0 4
 login
!
!
end
